[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Ingestion worker: knowledge base -> Apache Age graph + embeddings"
readme = "README.md"
authors = [
    { name = "Siddharth Dhaigude", email = "sd8capricon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.5",
    "common",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "redis>=6.2",
    "sqlalchemy[asyncio]>=2.0.42",
]

[project.scripts]
ingestion-worker = "ingestion_worker:main"

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
