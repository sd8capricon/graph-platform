[project]
name = "common"
version = "0.1.0"
description = "Shared library for the graphrag-apacheage services"
authors = [
    { name = "Siddharth Dhaigude", email = "sd8capricon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-litellm>=0.7.1",
    "litellm>=1.99.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.42",
]

[project.scripts]
graphrag-apacheage = "common:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `common` sits directly under this project directory, not under a nested
# `src/` - uv's default module root would look for `src/common/src/common`.
module-name = "common"
module-root = ""