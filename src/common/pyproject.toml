[project]
name = "common"
version = "0.1.0"
description = "Shared library for the graphrag-apacheage services"
authors = [
    { name = "Siddharth Dhaigude", email = "sd8capricon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "litellm>=1.99.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.42",
]

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
