# Object storage (common.storage). Deployment-shaped values can be overridden by env:
# STORAGE_PROVIDER, STORAGE_FILESYSTEM_ROOT (e.g. /data/storage on a mounted volume).
storage:
  provider: filesystem
  filesystem:
    root: data/volumes/storage
  # azure_blob:
  #   auth_mode: connection_string        # or managed_identity (needs account_url)
  #   connection_string_env: AZURE_STORAGE_CONNECTION_STRING
  #   account_url: https://<account>.blob.core.windows.net
  #   container: graph-platform
  #   create_container: true

# Shared Redis cache. The complete connection string (including any credentials)
# is secret and must only be supplied by the named environment variable.
redis:
  connection_string_env: REDIS_CONNECTION_STRING
