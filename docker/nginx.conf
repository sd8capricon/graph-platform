server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config rendered at container start from FRONTEND_*; never cache
    # it, or a stale API URL / upload limit could pin the SPA to a previous
    # deployment's values.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
