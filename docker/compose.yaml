name: graph-platform

# Infra services (postgres, rabbitmq, redis) live in compose.infra.yaml and are
# included here, so they are defined exactly once. `docker compose -f
# docker/compose.infra.yaml up -d` starts just the infra for host-side dev;
# this file starts the full stack.
include:
  - compose.infra.yaml

services:
  api-migrations:
    image: graph-platform/api:latest
    pull_policy: never
    command: ["dotnet", "GraphPlatform.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__PgConnectionString: ${API_PG_CONNECTION_STRING:-Host=postgres;Port=5432;Database=graph_platform;Username=graphplatform;Password=replace-me}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Storage__Provider: filesystem
      Storage__FileSystem__Root: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: graph-platform/api:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5087
      ConnectionStrings__PgConnectionString: ${API_PG_CONNECTION_STRING:-Host=postgres;Port=5432;Database=graph_platform;Username=graphplatform;Password=replace-me}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Database__AutoMigrate: "true"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:8080}
      Storage__Provider: filesystem
      Storage__FileSystem__Root: /data/storage
    ports:
      - "5087:5087"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-migrations:
        condition: service_completed_successfully
    volumes:
      - ../data/volumes/storage:/data/storage
    restart: unless-stopped

  python-schema-init:
    image: graph-platform/ingestion-worker:latest
    pull_policy: never
    command: ["python", "/app/docker/init_python_schema.py"]
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /data/storage
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
      - ../data/volumes/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestion-worker:
    image: graph-platform/ingestion-worker:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion-worker
    command:
      - celery
      - -A
      - ingestion_worker.celery_app
      - worker
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-graphplatform}:${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}@rabbitmq:5672//
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /data/storage
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
      - ../data/volumes/storage:/data/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingestion-beat:
    image: graph-platform/ingestion-worker:latest
    pull_policy: never
    command:
      - celery
      - -A
      - ingestion_worker.celery_app
      - beat
      - --schedule=/tmp/celerybeat-schedule
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-graphplatform}:${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}@rabbitmq:5672//
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: graph-platform/frontend:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-GraphForge}
    environment:
      FRONTEND_APP_NAME: ${FRONTEND_APP_NAME:-GraphForge}
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5087}
      FRONTEND_MAX_UPLOAD_BYTES: ${FRONTEND_MAX_UPLOAD_BYTES:-104857600}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
