name: graph-platform

services:
  postgres:
    image: graph-platform/postgres-age-vector:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${PGUSER:-graphplatform}
      POSTGRES_PASSWORD: ${PGPASSWORD:-replace-me}
      POSTGRES_DB: ${PGDATABASE:-graph_platform}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ../data/volumes/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-graphplatform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../data/volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api-migrations:
    image: graph-platform/api:latest
    pull_policy: never
    command: ["dotnet", "GraphPlatform.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__PgConnectionString: ${API_PG_CONNECTION_STRING:-Host=postgres;Port=5432;Database=graph_platform;Username=graphplatform;Password=replace-me}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Storage__Provider: filesystem
      Storage__FileSystem__Root: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: graph-platform/api:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5087
      ConnectionStrings__PgConnectionString: ${API_PG_CONNECTION_STRING:-Host=postgres;Port=5432;Database=graph_platform;Username=graphplatform;Password=replace-me}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Database__AutoMigrate: "true"
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:8080}
      Storage__Provider: filesystem
      Storage__FileSystem__Root: /data/storage
    ports:
      - "5087:5087"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api-migrations:
        condition: service_completed_successfully
    volumes:
      - ../data/volumes/storage:/data/storage
    restart: unless-stopped

  python-schema-init:
    image: graph-platform/ingestion-worker:latest
    pull_policy: never
    command: ["python", "/app/docker/init_python_schema.py"]
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /data/storage
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
      - ../data/volumes/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestion-worker:
    image: graph-platform/ingestion-worker:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion-worker
    command:
      - celery
      - -A
      - ingestion_worker.celery_app
      - worker
      - --loglevel=info
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-graphplatform}:${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}@rabbitmq:5672//
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      STORAGE_PROVIDER: filesystem
      STORAGE_FILESYSTEM_ROOT: /data/storage
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
      - ../data/volumes/storage:/data/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingestion-beat:
    image: graph-platform/ingestion-worker:latest
    pull_policy: never
    command:
      - celery
      - -A
      - ingestion_worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-graph_platform}
      PGUSER: ${PGUSER:-graphplatform}
      PGPASSWORD: ${PGPASSWORD:-replace-me}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-graphplatform}:${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}@rabbitmq:5672//
      INGESTION_CONFIG_PATH: /app/configs/local.yaml
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis://redis:6379/0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ../configs/local.yaml:/app/configs/local.yaml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: graph-platform/frontend:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-GraphForge}
    environment:
      FRONTEND_APP_NAME: ${FRONTEND_APP_NAME:-GraphForge}
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5087}
      FRONTEND_MAX_UPLOAD_BYTES: ${FRONTEND_MAX_UPLOAD_BYTES:-104857600}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
