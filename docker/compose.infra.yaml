name: graph-platform

# Infrastructure-only stack: PostgreSQL 18 + Apache AGE + pgvector, RabbitMQ
# and Redis. Start these on their own for local development outside Compose
# (API / worker / frontend running on the host):
#
#   docker compose --env-file docker/.env -f docker/compose.infra.yaml up -d
#
# The full stack (docker/compose.yaml) includes this file, so these three
# services are defined exactly once.
services:
  postgres:
    image: graph-platform/postgres-age-vector:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${PGUSER:-graphplatform}
      POSTGRES_PASSWORD: ${PGPASSWORD:-replace-me}
      POSTGRES_DB: ${PGDATABASE:-graph_platform}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ../data/volumes/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-graphplatform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-replaceWithRandomAlphanumericValue}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../data/volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
