[project]
name = "graphrag-apacheage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Dhaigude", email = "sd8capricon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "graphrag-common",
]

# No `[build-system]`: this root is a workspace root, not a package. uv builds
# and installs only the `common` member under `src/common/` (see ADR-0004).
[tool.uv.workspace]
members = ["src/common"]

[tool.uv.sources]
graphrag-common = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
